<text x="32" y="50" class="m" fill="#22d3ee" font-size="14">// alktrip/edita · alktrip/edita-plugins</text>

<text x="32" y="112" fill="#7c8ba1" font-size="15">Derived from the public source tree (src/, plugin-sdk/, third_party/) and the catalog CI workflow.</text>

<text x="74" y="263" fill="#a3b1c4">integrated terminal (libvterm) · compare · Markdown preview (md4c)</text>

<rect x="54" y="286" width="992" height="108" rx="12" fill="#0f1a2e" stroke="#1a2740"/>
<text x="74" y="314" fill="#e2e8f0" font-weight="600" font-size="17">Core services</text>

<text x="74" y="382" fill="#a3b1c4">plugin catalog and installer · minisign verification (OpenSSL Ed25519)</text>

<rect x="54" y="406" width="488" height="104" rx="12" fill="rgba(34,211,238,.06)" stroke="rgba(34,211,238,.4)"/>

<text x="74" y="484" fill="#8a99ae" class="m" font-size="13">same engine as Notepad++</text>
<rect x="558" y="406" width="488" height="104" rx="12" fill="rgba(139,92,246,.07)" stroke="rgba(139,92,246,.45)"/>

<text x="54" y="540" fill="#a3b1c4" font-size="14"><tspan class="m" fill="#8a99ae">quality ·</tspan> 79 Qt Test suites · CI on x86_64 and arm64 · ASan + UBSan job</text>
